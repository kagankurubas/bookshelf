name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # Blocking; after build so dist/ gets the service_role scan. Never --linked: CI must not reach production.
      - run: npm run check:security

  rls-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Docker is preinstalled on ubuntu-latest runners, so `supabase start`
      # can spin up local Postgres/Auth/PostgREST containers with no extra
      # setup. Using `npx supabase@latest` (rather than a separate CLI-setup
      # action) mirrors the exact local workflow documented in README.md's
      # "RLS integration tests" section.
      - name: Start local Supabase
        run: npx supabase@latest start

      # The local demo ANON_KEY/SERVICE_ROLE_KEY are NOT stable across
      # Supabase CLI versions - a value hardcoded here could fail signature
      # verification against whatever CLI version `npx supabase@latest`
      # resolves to on a given day. So these are captured fresh from this
      # run's own `supabase status -o env` output instead of ever being
      # hardcoded as workflow constants or GitHub secrets. They are local-only
      # demo credentials for a container this job just started, not real
      # secrets, so no repo/Actions secrets are needed at all.
      - name: Export local Supabase credentials
        run: |
          npx supabase@latest status -o env > /tmp/supabase-status.env
          extract() {
            grep "^$1=" /tmp/supabase-status.env | sed -E 's/^[A-Z_]+="(.*)"$/\1/'
          }
          echo "SUPABASE_URL=$(extract API_URL)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(extract ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(extract SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"

      - run: npm run test:integration

      - name: Stop local Supabase
        if: always()
        run: npx supabase@latest stop
