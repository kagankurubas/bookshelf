[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (exit 0) when nothing that feeds the Vite bundle changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.js pwa-assets.config.ts netlify.toml"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "must-revalidate"
